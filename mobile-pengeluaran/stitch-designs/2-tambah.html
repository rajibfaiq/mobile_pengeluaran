<body class="bg-slate-50 text-on-surface antialiased min-h-screen flex justify-center selection:bg-primary-container selection:text-white">
<!-- Mobile Viewport Canvas (390px fixed mobile container) -->
<main class="w-full max-w-[390px] min-h-screen bg-slate-50 flex flex-col shadow-xl relative border-x border-outline-variant/30">
<!-- App Header (Linear Task-Focused: Back Navigation, bottom navigation is suppressed per Semantic Shell rules) -->
<header class="sticky top-0 z-40 flex items-center justify-between h-14 px-4 bg-surface-container-lowest border-b border-outline-variant/40 shadow-sm">
<div class="flex items-center gap-3">
<a aria-label="Kembali ke Beranda" class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full text-on-surface hover:bg-surface-container-high transition-colors active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</a>
<h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">
          Tambah Pengeluaran
        </h1>
</div>
<div class="flex items-center">
<button aria-label="Bantuan Form" class="flex items-center justify-center w-9 h-9 rounded-full text-secondary hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">help_outline</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<div class="p-space-md flex-1 flex flex-col gap-space-lg">
<!-- Expense Form Card -->
<form class="bg-surface-container-lowest border border-outline-variant rounded-lg p-space-md shadow-sm flex flex-col gap-space-md" id="expenseForm">
<!-- Field 1: Judul Pengeluaran -->
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1" for="expenseTitle">
            Judul Pengeluaran <span class="text-error font-bold">*</span>
</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-secondary/60 focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all outline-none" id="expenseTitle" name="title" placeholder="Contoh: Makan Siang" required="" type="text"/>
</div>
<p class="font-body-sm text-body-sm text-secondary">Masukkan deskripsi singkat pengeluaran Anda.</p>
</div>
<!-- Field 2: Nominal (Rp) - Unformatted per REST API Spec -->
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface flex items-center justify-between" for="expenseAmount">
<span class="flex items-center gap-1">
              Nominal (Rp) <span class="text-error font-bold">*</span>
</span>
<span class="font-label-sm text-label-sm text-primary-container font-semibold tracking-wide bg-secondary-fixed/50 px-2 py-0.5 rounded">REST API NUMBER</span>
</label>
<div class="relative flex items-center">
<div class="absolute left-0 pl-4 flex items-center pointer-events-none">
<span class="font-headline-sm text-headline-sm text-secondary font-semibold">Rp</span>
</div>
<input class="w-full h-12 pl-12 pr-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-lg text-body-lg font-semibold placeholder:text-secondary/40 focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all outline-none [appearance:textfield] [&amp;::-webkit-outer-spin-button]:appearance-none [&amp;::-webkit-inner-spin-button]:appearance-none" id="expenseAmount" inputmode="numeric" name="amount" placeholder="25000" required="" type="number"/>
</div>
<div class="flex items-center gap-1 text-secondary">
<span class="material-symbols-outlined text-[14px]">info</span>
<p class="font-body-sm text-body-sm">Hanya angka, contoh: 25000 tanpa titik/koma</p>
</div>
</div>
<!-- Field 3: Category Selection -->
<div class="flex flex-col gap-2 pt-1">
<label class="font-label-lg text-label-lg text-on-surface">Pilih Kategori</label>
<!-- Category Chips / Radio Group -->
<div aria-label="Pilih Kategori" class="grid grid-cols-2 gap-2" role="radiogroup">
<!-- Category: Tanpa Kategori (Unselected) -->
<label class="category-chip cursor-pointer relative flex items-center justify-between h-11 px-3.5 rounded-lg border border-outline-variant bg-slate-100/90 text-slate-700 hover:bg-slate-200/70 transition-colors active:scale-95 duration-150">
<input class="sr-only" name="category" type="radio" value="tanpa_kategori"/>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-secondary">label_off</span>
<span class="font-label-md text-label-md">Tanpa kategori</span>
</div>
<span class="check-indicator hidden material-symbols-outlined text-[18px] text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
<!-- Category: Makanan (Selected Active State) -->
<label class="category-chip cursor-pointer relative flex items-center justify-between h-11 px-3.5 rounded-lg border border-primary-container bg-blue-100/70 text-blue-800 shadow-sm transition-all active:scale-95 duration-150">
<input checked="" class="sr-only" name="category" type="radio" value="makanan"/>
<div class="flex items-center gap-2 font-semibold">
<span class="material-symbols-outlined text-[18px] text-primary-container" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<span class="font-label-md text-label-md">Makanan</span>
</div>
<span class="check-indicator material-symbols-outlined text-[18px] text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
<!-- Category: Transport (Unselected) -->
<label class="category-chip cursor-pointer relative flex items-center justify-between h-11 px-3.5 rounded-lg border border-outline-variant bg-slate-100/90 text-slate-700 hover:bg-slate-200/70 transition-colors active:scale-95 duration-150">
<input class="sr-only" name="category" type="radio" value="transport"/>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-secondary">commute</span>
<span class="font-label-md text-label-md">Transport</span>
</div>
<span class="check-indicator hidden material-symbols-outlined text-[18px] text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
<!-- Category: Pendidikan (Unselected) -->
<label class="category-chip cursor-pointer relative flex items-center justify-between h-11 px-3.5 rounded-lg border border-outline-variant bg-slate-100/90 text-slate-700 hover:bg-slate-200/70 transition-colors active:scale-95 duration-150">
<input class="sr-only" name="category" type="radio" value="pendidikan"/>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-secondary">school</span>
<span class="font-label-md text-label-md">Pendidikan</span>
</div>
<span class="check-indicator hidden material-symbols-outlined text-[18px] text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
</div>
</div>
<!-- Field 4: Server Note / Backend Helper Notice -->
<div class="mt-1 rounded-lg bg-surface-container-low border border-outline-variant/60 p-3.5 flex items-start gap-3">
<div class="flex-shrink-0 w-8 h-8 rounded-full bg-secondary-fixed flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">cloud_sync</span>
</div>
<div class="flex flex-col gap-0.5">
<h4 class="font-label-md text-label-md text-on-surface font-semibold flex items-center gap-1.5">
              Tanggal otomatis dari server
            </h4>
<p class="font-body-sm text-body-sm text-secondary leading-relaxed">
              Waktu pencatatan akan digenerate otomatis oleh backend API saat transaksi disimpan.
            </p>
</div>
</div>
<!-- Action Buttons Cluster -->
<div class="flex flex-col gap-2.5 pt-3">
<!-- Primary Submit Button -->
<button class="w-full h-12 rounded-lg bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 shadow-sm active:scale-[0.98] transition-all duration-150" type="submit">
<span class="material-symbols-outlined text-[20px]">save</span>
<span>Simpan</span>
</button>
<!-- Secondary Cancel Action -->
<a class="w-full h-12 rounded-lg bg-transparent text-secondary hover:bg-surface-container-high/60 font-label-lg text-label-lg font-medium flex items-center justify-center active:scale-[0.98] transition-all duration-150" href="#">
            Batal
          </a>
</div>
</form>
<!-- Micro Budget Hint Info Card -->
<div class="rounded-lg border border-outline-variant/60 bg-surface-container-lowest p-3.5 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-2.5">
<div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
<span class="font-body-sm text-body-sm text-secondary">Status Sinkronisasi API</span>
</div>
<span class="font-label-sm text-label-sm font-semibold text-primary-container">Terhubung</span>
</div>
</div>
</main>
<!-- Interactive script for dynamic category chip state transitions -->
<script>
    document.querySelectorAll('.category-chip input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', function() {
        document.querySelectorAll('.category-chip').forEach(chip => {
          chip.classList.remove('border-primary-container', 'bg-blue-100/70', 'text-blue-800', 'font-semibold', 'shadow-sm');
          chip.classList.add('border-outline-variant', 'bg-slate-100/90', 'text-slate-700');
          const check = chip.querySelector('.check-indicator');
          if (check) check.classList.add('hidden');
          const icon = chip.querySelector('.material-symbols-outlined:not(.check-indicator)');
          if (icon) {
            icon.classList.remove('text-primary-container');
            icon.classList.add('text-secondary');
            icon.style.fontVariationSettings = "'FILL' 0";
          }
        });

        if (this.checked) {
          const parent = this.closest('.category-chip');
          parent.classList.remove('border-outline-variant', 'bg-slate-100/90', 'text-slate-700');
          parent.classList.add('border-primary-container', 'bg-blue-100/70', 'text-blue-800', 'font-semibold', 'shadow-sm');
          const check = parent.querySelector('.check-indicator');
          if (check) check.classList.remove('hidden');
          const icon = parent.querySelector('.material-symbols-outlined:not(.check-indicator)');
          if (icon) {
            icon.classList.remove('text-secondary');
            icon.classList.add('text-primary-container');
            icon.style.fontVariationSettings = "'FILL' 1";
          }
        }
      });
    });

    document.getElementById('expenseForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const title = document.getElementById('expenseTitle').value;
      const amount = document.getElementById('expenseAmount').value;
      const category = document.querySelector('input[name="category"]:checked')?.value;

      if (!title || !amount) {
        alert('Mohon lengkapi judul dan nominal pengeluaran.');
        return;
      }

      // Quick toast feedback simulation
      const submitBtn = this.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
        <span>Menyimpan...</span>
      `;

      setTimeout(() => {
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined text-[20px]">check</span>
          <span>Tersimpan!</span>
        `;
        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }, 1500);
      }, 800);
    });
  </script>
</body></html>
